name: Build Android Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - '*'
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permissions to Gradle
        run: |
          if [ ! -f "gradlew" ]; then
            echo "gradlew not found, generating wrapper..."
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Configure Keystore for Release Build
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Decoding release keystore from GitHub Secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > my-upload-key.jks
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          elif [ ! -f "my-upload-key.jks" ]; then
            echo "No keystore provided; creating temporary signing keystore for CI release build..."
            keytool -genkey -v -keystore my-upload-key.jks \
              -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Release, O=AI Video Generator, C=US"
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          fi

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Locate and Prepare APK
        run: |
          mkdir -p output-apk
          find app/build/outputs/apk/release/ -type f -name "*.apk" -exec cp {} output-apk/ai-video-generator-release.apk \;
          echo "Output APK details:"
          ls -la output-apk/

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-video-generator-release-apk
          path: output-apk/ai-video-generator-release.apk
          retention-days: 30
