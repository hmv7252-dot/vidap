name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
      - '*'
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore debug keystore if present
        run: |
          if [ -f "debug.keystore.base64" ]; then
            echo "Decoding debug.keystore from repository..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Ensure .env file exists
        run: |
          if [ ! -f ".env" ]; then
            echo "Creating fallback .env from .env.example..."
            cp .env.example .env 2>/dev/null || touch .env
          fi

      - name: Create Placeholder google-services.json If Missing
        run: |
          if [ ! -f "app/google-services.json" ]; then
            echo "Creating placeholder google-services.json..."
            cat << 'EOF' > app/google-services.json
{
  "project_info": {
    "project_number": "123456789",
    "project_id": "placeholder-project",
    "storage_bucket": "placeholder.appspot.com"
  },
  "client": [
    {
      "client_info": {
        "mobilesdk_app_id": "1:123456789:android:abcdef123456",
        "android_client_info": {
          "package_name": "com.aistudio.aivideogen.kzvxq"
        }
      },
      "oauth_client": [],
      "api_key": [
        {
          "current_key": "dummy_api_key"
        }
      ],
      "services": {}
    }
  ],
  "configuration_version": "1"
}
EOF
          fi

      - name: Prepare Gradle Wrapper
        run: |
          if [ ! -f "gradlew" ]; then
            echo "Generating gradlew from wrapper properties..."
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon -Dorg.gradle.configuration-cache=false

      - name: Collect Generated APKs
        run: |
          mkdir -p output-apks
          find app/build/outputs/apk/ -type f -name "*.apk" -exec cp -v {} output-apks/ \;
          echo "Generated APKs:"
          ls -la output-apks/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: output-apks/*.apk
          retention-days: 30
