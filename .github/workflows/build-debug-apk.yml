name: Build Debug APK

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle wrapper executable
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          else
            echo "Generating Gradle wrapper..."
            gradle wrapper
            chmod +x gradlew
          fi

      - name: Ensure .env file exists
        run: |
          if [ ! -f ".env" ]; then
            echo "Creating .env from .env.example..."
            cp .env.example .env 2>/dev/null || touch .env
          fi

      - name: Restore debug keystore if present
        run: |
          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            echo "Decoding debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Ensure mock google-services.json exists
        run: |
          if [ ! -f "app/google-services.json" ]; then
            echo "Generating placeholder google-services.json..."
            cat << 'EOF' > app/google-services.json
{
  "project_info": {
    "project_number": "123456789",
    "project_id": "placeholder-project",
    "storage_bucket": "placeholder.appspot.com"
  },
  "client": [
    {
      "client_info": {
        "mobilesdk_app_id": "1:123456789:android:abcdef123456",
        "android_client_info": {
          "package_name": "com.aistudio.aivideogen.kzvxq"
        }
      },
      "oauth_client": [],
      "api_key": [
        {
          "current_key": "dummy_api_key"
        }
      ],
      "services": {}
    }
  ],
  "configuration_version": "1"
}
EOF
          fi

      - name: Build Debug APK
        run: |
          set -e
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace -Dorg.gradle.configuration-cache=false
          else
            echo "Gradle wrapper not found."
            exit 1
          fi

      - name: Find Debug APK
        run: |
          echo "Searching for generated APK..."
          find . -type f -name "*-debug.apk" -print

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: |
            **/build/outputs/apk/debug/*-debug.apk
          if-no-files-found: error
          retention-days: 14
