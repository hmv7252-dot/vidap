name: Build Android Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install required Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" || true

      - name: Ensure .env file exists
        run: |
          if [ ! -f ".env" ]; then
            echo "Creating .env from .env.example..."
            cp .env.example .env 2>/dev/null || touch .env
          fi

      - name: Ensure signing keystore exists
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Decoding release keystore from secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS || 'upload' }}" >> $GITHUB_ENV
          elif [ -f "debug.keystore.base64" ]; then
            echo "Decoding debug.keystore from base64 for release signing..."
            base64 -d debug.keystore.base64 > debug.keystore
          else
            echo "Generating self-signed upload keystore..."
            keytool -genkey -v -keystore my-upload-key.jks \
              -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=AI Video Generator, O=AI Studio, C=US"
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_ALIAS=upload" >> $GITHUB_ENV
          fi

      - name: Ensure placeholder google-services.json exists
        run: |
          if [ ! -f "app/google-services.json" ]; then
            echo "Generating placeholder google-services.json..."
            cat << 'EOF' > app/google-services.json
{
  "project_info": {
    "project_number": "123456789",
    "project_id": "placeholder-project",
    "storage_bucket": "placeholder.appspot.com"
  },
  "client": [
    {
      "client_info": {
        "mobilesdk_app_id": "1:123456789:android:abcdef123456",
        "android_client_info": {
          "package_name": "com.aistudio.aivideogen.kzvxq"
        }
      },
      "oauth_client": [],
      "api_key": [
        {
          "current_key": "dummy_api_key"
        }
      ],
      "services": {}
    }
  ],
  "configuration_version": "1"
}
EOF
          fi

      - name: Make Gradle wrapper executable
        run: |
          if [ ! -f "gradlew" ]; then
            echo "Generating Gradle wrapper..."
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Build Release APK
        run: |
          ./gradlew assembleRelease --stacktrace --no-daemon -Dorg.gradle.configuration-cache=false

      - name: Search for generated APK
        run: |
          echo "Locating generated release APK..."
          find app/build/outputs/apk/release/ -type f -name "*.apk" -print
          count=$(find app/build/outputs/apk/release/ -type f -name "*.apk" | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "Error: No release APK found in app/build/outputs/apk/release/"
            exit 1
          fi

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: "**/build/outputs/apk/release/*.apk"
          if-no-files-found: error
          retention-days: 14
