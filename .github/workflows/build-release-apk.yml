name: Build Android Release APK

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          else
            echo "Generating Gradle wrapper..."
            gradle wrapper
            chmod +x gradlew
          fi

      - name: Ensure .env file exists
        run: |
          if [ ! -f ".env" ]; then
            echo "Creating .env from .env.example..."
            cp .env.example .env 2>/dev/null || touch .env
          fi

      - name: Ensure release signing keystore exists
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Decoding custom release keystore from secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS || 'upload' }}" >> $GITHUB_ENV
          elif [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            echo "Decoding debug.keystore from base64 for signing..."
            base64 -d debug.keystore.base64 > debug.keystore
          else
            echo "Generating self-signed upload keystore for release artifact..."
            keytool -genkey -v -keystore my-upload-key.jks \
              -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=AI Video Generator, O=AI Studio, C=US"
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_ALIAS=upload" >> $GITHUB_ENV
          fi

      - name: Ensure mock google-services.json exists
        run: |
          if [ ! -f "app/google-services.json" ]; then
            echo "Generating placeholder google-services.json..."
            cat << 'EOF' > app/google-services.json
{
  "project_info": {
    "project_number": "123456789",
    "project_id": "placeholder-project",
    "storage_bucket": "placeholder.appspot.com"
  },
  "client": [
    {
      "client_info": {
        "mobilesdk_app_id": "1:123456789:android:abcdef123456",
        "android_client_info": {
          "package_name": "com.aistudio.aivideogen.kzvxq"
        }
      },
      "oauth_client": [],
      "api_key": [
        {
          "current_key": "dummy_api_key"
        }
      ],
      "services": {}
    }
  ],
  "configuration_version": "1"
}
EOF
          fi

      - name: Build Release APK
        run: |
          set -e
          ./gradlew assembleRelease --stacktrace -Dorg.gradle.configuration-cache=false

      - name: Find Release APK
        run: |
          echo "Searching for generated release APK..."
          find . -type f -name "*release*.apk" -print

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: |
            **/build/outputs/apk/release/*release*.apk
          if-no-files-found: error
          retention-days: 14
